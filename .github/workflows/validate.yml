name: validate

# This repo owns no CI logic of its own. It calls the reusable workflow owned by
# `dEitY719/harness-skills` (dEitY719/dotfiles#1410 D-10), so a new check lands here the
# moment it lands there — no copy to keep in sync.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # No step of its own runs the repo's checks: the reusable workflow's
    # "Repo self-checks pass (tests/)" step discovers every tracked
    # `tests/*.sh` and runs it, which is how `tests/lib-selfchecks.sh` — and
    # through it every `lib/*.selfcheck.sh` — is gated here. Wiring a second
    # copy in this file is the "third branch" that workflow forbids; a new
    # check is added by a one-line script under `tests/`.
    uses: dEitY719/harness-skills/.github/workflows/skill-check.yml@main
    with:
      plugin-name: gh-issue
      # Two narrow exemptions from the repo-wide emoji ban, both for text the
      # skills quote rather than decorate with:
      #   1. the ai-metrics footer, whose chart / person / robot glyphs are the
      #      wire format itself (dEitY719/dotfiles#317 F-2, PR dEitY719/dotfiles#320).
      #      `lib/ai-metrics-footer.sh` is the only writer; metrics-helper.md
      #      shows the shape it emits;
      #   2. the pause-glyph `Postpone` block label, a real GitHub label name that
      #      `implement` and `proceed` refuse to start on.
      # Everywhere else the ban still applies.
      allow-emoji-paths: |
        lib/ai-metrics-footer.sh
        skills/create/references/metrics-helper.md
        skills/implement/references/claim.md
        skills/proceed/references/claim.md
        skills/proceed/references/help.md
